name: Keep the shared sky awake

# The sky is open for words until 15 November 2026. Render sleeps when idle,
# so this pings it to spare visitors a long wait. It stops by itself afterwards.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping until 15 November (Dubai time)
        run: |
          if [ "$(TZ=Asia/Dubai date +%Y%m%d)" -gt 20261115 ]; then
            echo "Past 15 November, nothing to do."
            exit 0
          fi
          curl -s -m 120 -o /dev/null -w "%{http_code}\n" https://cultural-text-galaxy.onrender.com/api/health || true
